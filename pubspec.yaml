name: camera_app

description: "A Flutter skin care analysis app with camera functionality."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Adjusted to a broader range for better compatibility

dependencies:
  flutter:
    sdk: flutter

  # Camera and Image Processing
  camera: ^0.10.5+5
  image: ^4.5.3
  google_mlkit_face_detection: ^0.12.0

  # UI and Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0

  # Charts and Data Visualization
  fl_chart: ^0.65.0

  # HTTP requests for API calls - NEW DEPENDENCY
  http: ^1.1.0

  # Optional: Uncomment if you plan to use OpenCV
  #opencv_4: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/haarcascade_frontalface_default.xml
    - Assets/face.png # Added for the avatar image referenced in your dashboard
    - Assets/product.png

  # Optional: Add custom fonts if needed
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf